name: anasoil_mobile
description: AnaSoil - App para interpretação de análises de solo
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  anasoil_shared:
    path: ../packages/anasoil_shared

  # State Management
  # ChangeNotifier já é built-in do Flutter

  # Navigation
  go_router: ^17.2.3

  # Dependency Injection
  get_it: ^9.2.1

  # HTTP Client
  dio: ^5.8.0

  # Local Storage
  shared_preferences: ^2.5.3

  # File Picker (para importar documentos)
  file_picker: ^11.0.2

  # Image Picker (para selecionar avatar da galeria ou câmera)
  image_picker: ^1.1.2

  # PDF Viewer (para visualizar PDFs)
  flutter_pdfview: ^1.3.3

  # PDF Text Extraction
  syncfusion_flutter_pdf: ^33.2.7

  # Charts (para gráficos de análise)
  fl_chart: ^1.2.0

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: 13.0.6

  # Bottom Navigation
  google_nav_bar: ^5.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
